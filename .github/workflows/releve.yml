# Le robot de SkyJo : toutes les quatre heures, il relit les flux
# d'actualite et la liste des supernovae, puis enregistre actus.json
# s'il y a du nouveau. On peut aussi le lancer a la main depuis l'onglet
# Actions, bouton "Run workflow".
name: Releve des actualites

on:
  schedule:
    - cron: '23 */4 * * *'      # a 0h23, 4h23, 8h23... (heure UTC)
  workflow_dispatch:

permissions:
  contents: write               # pour pouvoir enregistrer actus.json

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-24.04   # figé : ubuntu-latest passe à Ubuntu 26 en octobre 2026
    timeout-minutes: 10
    steps:
      # Versions figées par leur empreinte exacte : une étiquette peut être
      # déplacée par un tiers, une empreinte ne peut pas l'être.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6.3.0
        with:
          python-version: '3.12'

      - name: Installer le calcul des ephemerides
        run: pip install --quiet skyfield==1.55 skyfield-data==7.0.0

      - name: Relever les sources
        run: python3 releve.py

      - name: Enregistrer s'il y a du nouveau
        run: |
          if git diff --quiet -- actus.json && git ls-files --error-unmatch actus.json >/dev/null 2>&1; then
            echo "Rien de nouveau."
            exit 0
          fi
          git config user.name "skyjo-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actus.json
          git commit -m "Releve du $(date -u '+%Y-%m-%d %H:%M') UTC"
          # le robot des vignettes peut avoir ecrit entre-temps : on se recale
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done
          exit 1
